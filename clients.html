<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>سنترال محمد الجنبيهي - دليل العملاء</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#eef2ff',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                            glow: 'rgba(99, 102, 241, 0.35)'
                        },
                        dark: {
                            bg: '#080c14',
                            surface: '#0f172a',
                            card: '#141e33',
                            border: '#1e293b'
                        }
                    },
                    fontFamily: {
                        cairo: ['Cairo', 'sans-serif']
                    }
                }
            }
        }
    </script>
    
    <!-- Google Fonts & Font Awesome -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

    <style>
        body {
            font-family: 'Cairo', system-ui, sans-serif;
            background-color: #080c14;
            color: #f1f5f9;
            background-image: 
                radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.08) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(14, 165, 233, 0.05) 0px, transparent 50%);
            background-attachment: fixed;
        }

        .glass-card {
            background: rgba(20, 30, 51, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.07);
        }

        .glass-card-hover {
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .glass-card-hover:hover {
            border-color: rgba(99, 102, 241, 0.4);
            box-shadow: 0 10px 25px -5px rgba(99, 102, 241, 0.25);
            transform: translateY(-2px);
        }
    </style>
</head>
<body class="min-h-screen pb-20 md:pb-10 flex flex-col">

<!-- Loading Spinner Overlay -->
<div id="loadingOverlay" class="fixed inset-0 z-50 flex flex-col items-center justify-center bg-black/80 backdrop-blur-md hidden">
    <div class="relative w-14 h-14">
        <div class="w-14 h-14 rounded-full border-4 border-indigo-500/20 border-t-indigo-500 animate-spin"></div>
        <div class="absolute inset-0 flex items-center justify-center">
            <i class="fas fa-microchip text-indigo-400 animate-pulse"></i>
        </div>
    </div>
    <p class="mt-3 text-xs font-semibold text-slate-300">جاري تحميل دليل العملاء...</p>
</div>

<!-- Header & Navigation Bar -->
<header class="sticky top-0 z-40 glass-card border-b border-white/10">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 to-sky-500 flex items-center justify-center shadow-lg shadow-indigo-600/30">
                <i class="fas fa-users text-white text-lg"></i>
            </div>
            <div>
                <h1 class="text-base sm:text-lg font-black tracking-tight bg-gradient-to-r from-white via-slate-100 to-indigo-300 bg-clip-text text-transparent">
                    سنترال محمد الجنبيهي
                </h1>
                <p class="text-[10px] text-slate-400">سجل وحسابات العملاء</p>
            </div>
        </div>

        <!-- Desktop Navigation Tabs -->
        <nav class="hidden md:flex items-center gap-2 p-1 rounded-2xl bg-dark-surface/90 border border-white/5 text-xs font-bold">
            <a href="index.html" class="px-4 py-2 rounded-xl text-slate-300 hover:text-white transition flex items-center gap-2">
                <i class="fas fa-chart-pie"></i> الرئيسية
            </a>
            <a href="devices.html" class="px-4 py-2 rounded-xl text-slate-300 hover:text-white transition flex items-center gap-2">
                <i class="fas fa-screwdriver-wrench"></i> الأجهزة
            </a>
            <a href="inventory.html" class="px-4 py-2 rounded-xl text-slate-300 hover:text-white transition flex items-center gap-2">
                <i class="fas fa-boxes-stacked"></i> المخزن
            </a>
            <a href="clients.html" class="px-4 py-2 rounded-xl bg-gradient-to-r from-indigo-600 to-indigo-500 text-white shadow-md flex items-center gap-2">
                <i class="fas fa-users"></i> العملاء
            </a>
            <a href="parts.html" class="px-4 py-2 rounded-xl text-slate-300 hover:text-white transition flex items-center gap-2">
                <i class="fas fa-cart-shopping text-rose-400"></i> النواقص
            </a>
        </nav>

        <!-- Fast Action -->
        <div class="flex items-center gap-2">
            <a href="devices.html?action=add" class="bg-gradient-to-r from-indigo-600 to-indigo-500 hover:from-indigo-500 hover:to-indigo-600 text-white px-3.5 py-2 rounded-xl text-xs sm:text-sm font-bold shadow-lg shadow-indigo-600/30 transition flex items-center gap-1.5">
                <i class="fas fa-plus"></i>
                <span>تسجيل صيانة</span>
            </a>
        </div>
    </div>
</header>

<!-- MAIN CONTENT -->
<main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mt-6 flex-1 w-full space-y-4">

    <!-- Search Controls -->
    <div class="glass-card p-3.5 rounded-2xl flex items-center gap-3">
        <div class="relative w-full">
            <i class="fas fa-search absolute right-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
            <input type="text" id="searchInput" onkeyup="filterClients()" placeholder="بحث في دليل العملاء بالاسم أو رقم الهاتف..." 
                class="w-full bg-dark-bg/80 border border-white/10 rounded-xl pr-9 pl-4 py-2 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition">
        </div>
    </div>

    <!-- Clients Grid -->
    <div id="clientsContainer" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
        <!-- Injected via JS -->
    </div>

    <!-- Empty State -->
    <div id="emptyState" class="hidden glass-card p-12 rounded-3xl text-center">
        <i class="fas fa-user-slash text-slate-600 text-3xl mb-2"></i>
        <p class="text-xs text-slate-400">لا يوجد عملاء مطابقين للبحث</p>
    </div>

</main>

<!-- Mobile Bottom App Bar -->
<nav class="md:hidden fixed bottom-0 inset-x-0 glass-card border-t border-white/10 z-40 py-2 px-4 flex justify-around">
    <a href="index.html" class="flex flex-col items-center gap-1 text-[10px] text-slate-400 hover:text-indigo-400">
        <i class="fas fa-chart-pie text-base"></i> الرئيسية
    </a>
    <a href="devices.html" class="flex flex-col items-center gap-1 text-[10px] text-slate-400 hover:text-indigo-400">
        <i class="fas fa-screwdriver-wrench text-base"></i> الأجهزة
    </a>
    <a href="inventory.html" class="flex flex-col items-center gap-1 text-[10px] text-slate-400 hover:text-indigo-400">
        <i class="fas fa-boxes-stacked text-base"></i> المخزن
    </a>
    <a href="clients.html" class="flex flex-col items-center gap-1 text-[10px] text-indigo-400 font-bold">
        <i class="fas fa-users text-base"></i> العملاء
    </a>
    <a href="parts.html" class="flex flex-col items-center gap-1 text-[10px] text-slate-400 hover:text-indigo-400">
        <i class="fas fa-cart-shopping text-base text-rose-400"></i> النواقص
    </a>
</nav>

<script>
    const BASE_DB_URL = "https://repairshop-e2483-default-rtdb.firebaseio.com";
    let clientsMap = {};

    document.addEventListener('DOMContentLoaded', fetchClients);

    async function fetchClients() {
        showLoading(true);
        try {
            const res = await fetch(`${BASE_DB_URL}/data/devices.json`);
            showLoading(false);
            if (!res.ok) return;
            const data = await res.json();
            
            clientsMap = {};
            const deviceList = Object.values(data || {});

            // Process devices in order to track latest registration timestamp
            deviceList.forEach(d => {
                const name = (d.name || 'عميل').trim();
                const deviceTime = d.id ? parseInt(d.id.replace('ID', '')) || 0 : 0;

                if (!clientsMap[name]) {
                    clientsMap[name] = {
                        name,
                        phone: d.phone || '',
                        devices: [],
                        latestTime: deviceTime
                    };
                }
                if (d.phone && !clientsMap[name].phone) clientsMap[name].phone = d.phone;
                if (deviceTime > clientsMap[name].latestTime) clientsMap[name].latestTime = deviceTime;
                clientsMap[name].devices.push(d);
            });

            renderClients();
        } catch (e) {
            showLoading(false);
            console.error(e);
        }
    }

    function renderClients() {
        const cont = document.getElementById('clientsContainer');
        cont.innerHTML = '';
        
        // Sort clients: NEWEST FIRST (الأحدث فوق والقديم في الأسفل)
        const list = Object.values(clientsMap).sort((a, b) => (b.latestTime || 0) - (a.latestTime || 0));

        if (list.length === 0) {
            document.getElementById('emptyState').classList.remove('hidden');
            return;
        }
        document.getElementById('emptyState').classList.add('hidden');

        list.forEach(c => {
            const totalSpent = c.devices.reduce((sum, d) => sum + (Number(d.cost) || 0), 0);
            cont.innerHTML += `
                <a href="client-details.html?name=${encodeURIComponent(c.name)}" class="glass-card glass-card-hover p-4 rounded-2xl cursor-pointer block client-card-item" data-search="${(c.name + ' ' + c.phone).toLowerCase()}">
                    <div class="flex items-center gap-3">
                        <div class="w-12 h-12 rounded-2xl bg-indigo-600/20 border border-indigo-500/30 text-indigo-400 flex items-center justify-center text-lg font-bold">
                            ${c.name.charAt(0)}
                        </div>
                        <div class="flex-1">
                            <h4 class="text-sm font-bold text-white">${escapeHtml(c.name)}</h4>
                            <span class="text-xs text-slate-400 block mt-0.5" dir="ltr">${c.phone || 'بدون رقم مسجل'}</span>
                        </div>
                        <i class="fas fa-chevron-left text-slate-500 text-xs"></i>
                    </div>

                    <div class="mt-3 pt-3 border-t border-white/5 flex justify-between text-xs text-slate-300">
                        <span><i class="fas fa-mobile-alt text-indigo-400 ml-1"></i>${c.devices.length} أجهزة مسجلة</span>
                        <span class="font-bold text-emerald-400">${totalSpent.toLocaleString('ar-EG')} ج.م</span>
                    </div>
                </a>`;
        });
    }

    function filterClients() {
        const q = document.getElementById('searchInput').value.toLowerCase().trim();
        const items = document.querySelectorAll('.client-card-item');
        let count = 0;

        items.forEach(el => {
            const matches = el.getAttribute('data-search').includes(q);
            if (matches) {
                el.style.display = 'block';
                count++;
            } else {
                el.style.display = 'none';
            }
        });

        document.getElementById('emptyState').classList.toggle('hidden', count > 0);
    }

    function showLoading(show) {
        document.getElementById('loadingOverlay').classList.toggle('hidden', !show);
    }

    function escapeHtml(s) {
        return s ? String(s).replace(/[&<>'"]/g, t => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[t]||t)) : '';
    }
</script>
</body>
</html>
