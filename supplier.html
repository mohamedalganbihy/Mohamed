<meta name='viewport' content='width=device-width, initial-scale=1'/><!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>طلب قطع غيار - سنترال محمد الجنبيهي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        body {
            font-family: 'Cairo', system-ui, sans-serif;
            background-color: #080c14;
            color: #f1f5f9;
        }
        .glass-card {
            background: rgba(20, 30, 51, 0.75);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
    </style>
</head>
<body class="min-h-screen p-4 sm:p-6 flex flex-col items-center">

<div id="loadingOverlay" class="fixed inset-0 z-50 flex flex-col items-center justify-center bg-black/80 backdrop-blur-md hidden">
    <div class="w-12 h-12 rounded-full border-4 border-emerald-500/20 border-t-emerald-500 animate-spin"></div>
    <p class="mt-3 text-xs font-semibold text-slate-300">جاري المعالجة...</p>
</div>

<main class="w-full max-w-2xl space-y-4">
    <!-- Header -->
    <div class="glass-card p-5 rounded-3xl text-center space-y-2 border-emerald-500/30">
        <div class="inline-flex p-3 rounded-2xl bg-emerald-600/20 text-emerald-400 mb-1">
            <i class="fas fa-boxes-packing text-2xl"></i>
        </div>
        <h1 class="text-lg sm:text-xl font-black text-white">طلب قطع غيار - سنترال محمد الجنبيهي</h1>
        <p class="text-xs text-slate-400">يرجى الضغط على "تم التوفير" أمام أي قطعة تم تجهيزها</p>
    </div>

    <!-- Items List -->
    <div id="supplierPartsList" class="space-y-3"></div>

    <!-- Empty State -->
    <div id="emptyState" class="hidden glass-card p-10 rounded-3xl text-center space-y-2">
        <i class="fas fa-circle-check text-emerald-400 text-5xl"></i>
        <h4 class="text-base font-bold text-white">تم توفير جميع القطع المطلوبة!</h4>
        <p class="text-xs text-slate-400">شكراً لتعاونكم، القائمة فارغة حالياً.</p>
    </div>
</main>

<script>
    const BASE_DB_URL = "https://repairshop-e2483-default-rtdb.firebaseio.com";
    let requestedIds = [];

    document.addEventListener('DOMContentLoaded', () => {
        const urlParams = new URLSearchParams(window.location.search);
        const idsParam = urlParams.get('ids');
        if (idsParam) {
            requestedIds = idsParam.split(',').filter(Boolean);
        }
        fetchSupplierParts();
    });

    async function fetchSupplierParts() {
        showLoading(true);
        try {
            const res = await fetch(`${BASE_DB_URL}/data/parts.json`);
            showLoading(false);
            if (!res.ok) return;
            const data = await res.json() || {};
            
            let parts = Object.values(data);
            if (requestedIds.length > 0) {
                parts = parts.filter(p => requestedIds.includes(p.id));
            }
            renderList(parts);
        } catch (e) {
            showLoading(false);
            console.error(e);
        }
    }

    function renderList(parts) {
        const cont = document.getElementById('supplierPartsList');
        cont.innerHTML = '';

        if (parts.length === 0) {
            document.getElementById('emptyState').classList.remove('hidden');
            return;
        }
        document.getElementById('emptyState').classList.add('hidden');

        parts.forEach((p, idx) => {
            cont.innerHTML += `
                <div id="item-${p.id}" class="glass-card p-4 rounded-2xl flex items-center justify-between gap-3 border-white/5 transition duration-300">
                    <div class="flex items-center gap-3">
                        <span class="w-7 h-7 rounded-xl bg-white/5 flex items-center justify-center text-xs font-black text-slate-300">${idx + 1}</span>
                        <h5 class="text-sm font-bold text-slate-100">${escapeHtml(p.name)}</h5>
                    </div>
                    <button onclick="markAsProvided('${p.id}', '${p.deviceId || ''}')" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold px-3.5 py-2 rounded-xl transition flex items-center gap-1.5 shadow-lg shadow-emerald-600/20 whitespace-nowrap">
                        <i class="fas fa-check"></i>
                        <span>تم التوفير</span>
                    </button>
                </div>
            `;
        });
    }

    async function markAsProvided(partId, deviceId) {
        if (!confirm("تأكيد توفير هذه القطعة؟")) return;
        showLoading(true);
        
        await fetch(`${BASE_DB_URL}/data/parts/${partId}.json`, { method: "DELETE" });
        if (deviceId) {
            await fetch(`${BASE_DB_URL}/data/devices/${deviceId}.json`, {
                method: "PATCH",
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ status: "قيد الصيانة" })
            });
        }
        showLoading(false);
        
        // إزالة العنصر من الشاشة وإعادة التحقق
        requestedIds = requestedIds.filter(id => id !== partId);
        fetchSupplierParts();
    }

    function showLoading(show) { document.getElementById('loadingOverlay').classList.toggle('hidden', !show); }
    function escapeHtml(s) { return s ? String(s).replace(/[&<>'"]/g, t => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[t]||t)) : ''; }
</script>
</body>
</html>
